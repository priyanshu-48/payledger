server:
  port: 8081
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
payledger:
  security:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8084/.well-known/jwks.json}
    issuer: payledger-auth
  ratelimit:
    payments-per-minute: ${PAYMENT_RATE_PER_MINUTE:30}
  bank:
    api-key: ${BANK_API_KEY:}   # the mock bank refuses calls without it; empty = nobody gets in
    base-url: ${BANK_URL:http://localhost:8081/mock-bank}
    timeout: ${BANK_TIMEOUT:PT3S}
  mock-bank:
    enabled: ${MOCK_BANK_ENABLED:true}
    latency-min-ms: ${MOCK_BANK_LATENCY_MIN_MS:50}
    latency-max-ms: ${MOCK_BANK_LATENCY_MAX_MS:2000}
    decline-rate: ${MOCK_BANK_DECLINE_RATE:0.05}
    timeout-rate: ${MOCK_BANK_TIMEOUT_RATE:0.03}
    lost-response-rate: ${MOCK_BANK_LOST_RESPONSE_RATE:0.01}
    stall: ${MOCK_BANK_STALL:PT5S}
    seed: ${MOCK_BANK_SEED:0}
  outbox:
    topic: payments.events
    enabled: ${OUTBOX_ENABLED:true}
    interval: ${OUTBOX_INTERVAL:PT0.2S}
    batch-size: 100
    lease: ${OUTBOX_LEASE:PT10S}
    send-timeout: PT10S
  status-check:
    grace: ${STATUS_CHECK_GRACE:PT15S}
    interval: ${STATUS_CHECK_INTERVAL:PT30S}
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
management:
  tracing:
    sampling:
      probability: 1.0   # demo scale: trace everything (ADR 0016)
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
