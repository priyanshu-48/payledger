server:
  port: 8082
spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  batch:
    job:
      enabled: false          # jobs run only when the recon API launches them
    jdbc:
      initialize-schema: never   # Flyway creates the Spring Batch tables (V5)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        order_updates: true   # flush row updates in primary-key order: no DB deadlocks between opposite transfers
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
payledger:
  security:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8084/.well-known/jwks.json}
    issuer: payledger-auth
  ratelimit:
    transfers-per-minute: ${TRANSFER_RATE_PER_MINUTE:30}
  outbox:
    topic: ledger.events
    enabled: ${OUTBOX_ENABLED:true}
    interval: ${OUTBOX_INTERVAL:PT0.2S}
    batch-size: 100
    lease: ${OUTBOX_LEASE:PT10S}
    send-timeout: PT10S
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
ledger:
  recon:
    chunk-size: ${LEDGER_RECON_CHUNK_SIZE:500}
    storage-dir: ${LEDGER_RECON_DIR:${java.io.tmpdir}/payledger-recon}
  consumer:
    enabled: ${LEDGER_CONSUMER_ENABLED:true}
    concurrency: 3
    retry:
      initial: ${LEDGER_CONSUMER_RETRY_INITIAL:PT0.5S}
      max-retries: 3
  locking-strategy: ${LEDGER_LOCKING_STRATEGY:PESSIMISTIC}   # PESSIMISTIC | OPTIMISTIC (ADR 0009)
management:
  tracing:
    sampling:
      probability: 1.0   # demo scale: trace everything (ADR 0016)
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
