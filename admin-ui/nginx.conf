# Serves the built UI and forwards /api/<service>/ to the services, so the browser stays on one origin (ADR 0021).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;   # reconciliation files

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Never reachable from a browser: the mock bank (it has its own key) and every service's actuator.
    location /api/payments/mock-bank/ { return 404; }
    location ~ ^/api/[a-z]+/actuator { return 404; }

    location /api/auth/     { proxy_pass http://auth-service:8084/; }
    location /api/payments/ { proxy_pass http://payment-service:8081/; }
    location /api/ledger/   { proxy_pass http://ledger-service:8082/; }

    location / { try_files $uri /index.html; }
}
